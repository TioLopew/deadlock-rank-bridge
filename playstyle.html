<!doctype html><meta charset="utf-8"><title>Deadlock rank mod: playstyle</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; color: #fff; font-family: Radiance, "Segoe UI", sans-serif; }
svg { display: block; }
</style>
<body>
<script src="shared.js?v=da2c788e39"></script>
<script src="playstyle.js?v=e114d79377"></script>
<script>
// Playstyle radar of the profile page: playstyle.html#acc=<account>&p=<title prefix>&q=<request id>
//   &ax=<the 6 axis names, in the game's language>&w=<"all time" note, in the game's language>
// Every axis is where the player's average of the last 30 days sits among everyone's averages of those days
// (0-100, 50 = the middle). Early impact: souls and kills + assists at 10:00 against the community at 10:00.
// A player with no match in 30 days is shown with all his matches (and the note) against the same community.
var token = 0;
var ACCENT = "#3fbf7f", MUTED = "#c4c9d0";

function draw(sc, labels, note) {
	var W = Math.max(240, window.innerWidth || 400), H = Math.max(180, window.innerHeight || 260), r2 = DLRPage.r2;
	// labels sit just outside the corners, the name over its value: the radius leaves room for the widest name at
	// the side corners and for two lines at the top and bottom ones. The shape takes only RADAR_SHARE of that room:
	// a compact radar with big, readable labels.
	var RADAR_SHARE = 0.7;
	var widest = Math.max.apply(null, labels.map(function (l) { return String(l || "").length; })) * 8.6 + 6;
	var bottomRoom = note ? 18 : 4;
	var cx = W / 2, cy = (H - bottomRoom) / 2 + 8;
	var R = Math.max(34, RADAR_SHARE * Math.min((W / 2 - widest - 6) / 0.97, ((H - bottomRoom) / 2 - 40) / 1.12));
	function pt(i, share) {
		var a = -Math.PI / 2 + i * Math.PI / 3;
		return [cx + Math.cos(a) * R * share, cy + Math.sin(a) * R * share];
	}
	var s = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" font-family="Radiance, Segoe UI, sans-serif">'];
	[0.25, 0.5, 0.75, 1].forEach(function (ring) {
		s.push('<polygon points="' + [0, 1, 2, 3, 4, 5].map(function (i) { return pt(i, ring).map(r2).join(","); }).join(" ") +
			'" fill="none" stroke="#fff" stroke-opacity="' + (ring === 0.5 ? 0.22 : 0.12) + '"/>');
	});
	for (var i = 0; i < 6; i++) s.push('<line x1="' + r2(cx) + '" y1="' + r2(cy) + '" x2="' + r2(pt(i, 1)[0]) + '" y2="' + r2(pt(i, 1)[1]) + '" stroke="#fff" stroke-opacity="0.12"/>');
	var known = sc.filter(function (v) { return v !== null; });
	if (known.length >= 3) {
		var shape = sc.map(function (v, i) { return pt(i, (v === null ? 0 : v) / 100).map(r2).join(","); }).join(" ");
		s.push('<polygon points="' + shape + '" fill="' + ACCENT + '" fill-opacity="0.28" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linejoin="round"/>');
		sc.forEach(function (v, i) {
			if (v === null) return;
			var p = pt(i, v / 100);
			s.push('<circle cx="' + r2(p[0]) + '" cy="' + r2(p[1]) + '" r="3.5" fill="' + ACCENT + '"/>');
		});
	}
	var best = known.length ? Math.max.apply(null, known) : null;
	sc.forEach(function (v, i) {
		var p = pt(i, 1.12), anchor = Math.abs(p[0] - cx) < 4 ? "middle" : p[0] < cx ? "end" : "start";
		// top corner: both lines above it; bottom corner: below it; side corners: centred on it
		var y1 = p[1] < cy - R * 0.5 ? p[1] - 24 : p[1] > cy + R * 0.5 ? p[1] + 15 : p[1] - 5;
		var lit = v !== null && best !== null && best - v < 0.5;
		s.push('<text x="' + r2(p[0]) + '" y="' + r2(y1) + '" text-anchor="' + anchor + '" font-size="13" font-weight="800" letter-spacing="0.5" fill="' + (lit ? "#7ee2a8" : "#fff") + '">' +
			DLRPage.esc((labels[i] || "").toUpperCase()) + "</text>");
		s.push('<text x="' + r2(p[0]) + '" y="' + r2(y1 + 18) + '" text-anchor="' + anchor + '" font-size="16" font-weight="800" fill="' + (lit ? "#7ee2a8" : MUTED) + '">' +
			(v === null ? "—" : Math.round(v)) + "</text>");
	});
	if (note) s.push('<text x="' + r2(cx) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + MUTED + '">' + DLRPage.esc(note) + "</text>");
	s.push("</svg>");
	document.body.innerHTML = s.join("");
}

function start() {
	var P = DLRPage.params(), acc = P.get("acc") || "", mine = ++token;
	var labels = String(P.get("ax") || "Damage,Farming,Tank,Support,Early impact,Pusher").split(",");
	document.body.innerHTML = "";
	if (!/^\d+$/.test(acc)) return DLRPage.tell(P, "error");
	Promise.all([player(acc), community()]).then(function (r) {
		if (mine !== token) return;
		var sc = scores(r[0], r[1]);
		if (sc.filter(function (v) { return v !== null; }).length < 3) return DLRPage.tell(P, "empty");
		var note = r[0].all ? P.get("w") || "" : "";
		var redraw = function () { if (mine === token) draw(sc, labels, note); };
		redraw();
		window.onresize = redraw;
		DLRPage.tell(P, "ready");
	}, function () {
		if (mine === token) DLRPage.tell(P, "error");
	});
}

window.addEventListener("hashchange", start);
start();
</script>
