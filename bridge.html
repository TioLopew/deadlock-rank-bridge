<!doctype html><meta charset="utf-8"><title>Deadlock rank mod bridge</title><script>
// Bridge page of the Deadlock rank mod, opened by the game in a hidden HTML panel (the game's HTML panels only open
// http(s) pages, so it is hosted on GitHub Pages):
//   bridge.html?job=<profile|ranks>&p=<title prefix>&q=<request id>&acc=<account>|accs=<accounts>
// Data comes from deadlock-api; results go back to Panorama through document.title, one short message at a time.
var P = new URLSearchParams(location.search);
var PREFIX = P.get("p") || "", REQ = Number(P.get("q"));
var MAX_MESSAGE = 1800;
var queue = [], busy = false, seq = 0;

function send(data, fin) {
	queue.push([data, fin]);
	if (!busy) next();
}

function next() {
	var item = queue.shift();
	if (!item) { busy = false; return; }
	busy = true;
	seq++;
	document.title = PREFIX + JSON.stringify({ q: REQ, s: seq, f: item[1] ? 1 : 0, d: item[0] });
	setTimeout(next, 250);
}

// splits {key: value} into messages of kind k that stay short enough for a page title
function sendMap(k, map) {
	var part = {}, size = 0;
	Object.keys(map).forEach(function (key) {
		var piece = JSON.stringify(map[key]).length + key.length + 4;
		if (size + piece > MAX_MESSAGE && size) {
			send({ k: k, d: part }, 0);
			part = {};
			size = 0;
		}
		part[key] = map[key];
		size += piece;
	});
	if (size) send({ k: k, d: part }, 0);
}

var API = "https://api.deadlock-api.com";
function get(path) {
	return fetch(API + path).then(function (r) { return r.ok ? r.json() : Promise.reject("HTTP " + r.status); });
}

function won(m) { return m.player_team == m.match_result ? 1 : 0; }

var LATEST = 16;
var METRICS_CACHE_MS = 6 * 3600 * 1000;

// community distribution of per-player stats over their latest LATEST matches; cached by the browser for a few hours
function metrics(mode) {
	var key = "dlr_metrics_" + mode + "_" + LATEST;
	try {
		var c = JSON.parse(localStorage.getItem(key) || "null");
		if (c && Date.now() - c.t < METRICS_CACHE_MS) return Promise.resolve(c.d);
	} catch (e) { }
	return get("/v1/analytics/player-stats/metrics?match_mode=" + mode + "&max_matches=" + LATEST).then(function (d) {
		var keep = { accuracy: d.accuracy, crit_shot_rate: d.crit_shot_rate };
		try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: keep })); } catch (e) { }
		return keep;
	});
}

// percentile of value inside the thresholds percentile1..percentile99 (linear between them)
function percentile(value, dist) {
	var at = [1, 5, 10, 25, 50, 75, 90, 95, 99];
	if (!dist || typeof value !== "number") return null;
	var prev = null;
	for (var i = 0; i < at.length; i++) {
		var v = dist["percentile" + at[i]];
		if (typeof v !== "number") return null;
		if (value < v) {
			if (prev === null) return at[0];
			return prev[1] === v ? prev[0] : prev[0] + (at[i] - prev[0]) * (value - prev[1]) / (v - prev[1]);
		}
		prev = [at[i], v];
	}
	return at[at.length - 1];
}

// accuracy and headshot (crit) rate over the latest matches, with their community percentiles
function perf(acc, latest) {
	if (!latest.length) return Promise.resolve(null);
	var ranked = latest.filter(function (m) { return m.match_mode == 4; }).length;
	var mode = ranked * 2 >= latest.length ? "Ranked" : "Unranked";
	var ids = latest.map(function (m) { return m.match_id; }).join(",");
	var meta = get("/v1/matches/metadata?match_ids=" + ids + "&account_ids=" + acc + "&only_filtered_players=true" +
		"&include_player_final_stats=true&include_info=false&limit=" + latest.length + "&format=json");
	return Promise.all([meta, metrics(mode)]).then(function (r) {
		var hit = 0, missed = 0, heroHit = 0, crit = 0, n = 0;
		r[0].forEach(function (match) {
			(match.players || []).forEach(function (p) {
				var s = p.final_stats;
				if (p.account_id != acc || !s) return;
				n++;
				hit += s.shots_hit || 0;
				missed += s.shots_missed || 0;
				heroHit += s.hero_bullets_hit || 0;
				crit += s.hero_bullets_hit_crit || 0;
			});
		});
		var accuracy = hit + missed ? hit / (hit + missed) : null;
		var hs = heroHit + crit ? crit / (heroHit + crit) : null;
		return {
			acc: [accuracy, percentile(accuracy, r[1].accuracy)],
			hs: [hs, percentile(hs, r[1].crit_shot_rate)],
			n: n, md: mode == "Ranked" ? 1 : 0
		};
	});
}

var jobs = {
	// one player's profile: totals per hero, the latest matches, accuracy / headshot rate over those matches
	profile: function () {
		var acc = P.get("acc");
		get("/v1/players/" + acc + "/match-history")
			.then(function (all) {
				// regular 6v6 games only: unranked, ranked and placement matches, newest first
				var a = all.filter(function (m) { return m.game_mode == 1 && [1, 4, 8].indexOf(m.match_mode) >= 0; })
					.sort(function (x, y) { return y.start_time - x.start_time; });
				// per hero: [games, wins, ranked games, ranked wins, last hits, denies]
				var heroes = {};
				a.forEach(function (m) {
					var e = heroes[m.hero_id] = heroes[m.hero_id] || [0, 0, 0, 0, 0, 0];
					var ranked = m.match_mode == 4 ? 1 : 0;
					e[0]++; e[1] += won(m); e[2] += ranked; e[3] += ranked && won(m); e[4] += m.last_hits; e[5] += m.denies;
				});
				sendMap("h", heroes);
				// latest matches: [match id, hero, win, kills, deaths, assists, net worth, duration, start time, ranked]
				var latest = a.slice(0, LATEST), matches = {};
				latest.forEach(function (m, i) {
					matches[i] = [m.match_id, m.hero_id, won(m), m.player_kills, m.player_deaths, m.player_assists,
						m.net_worth, m.match_duration_s, m.start_time, m.match_mode == 4 ? 1 : 0];
				});
				sendMap("m", matches);
				return perf(acc, latest)
					.then(function (p) { if (p) send({ k: "p", d: p }, 0); }, function () { })
					.then(function () { send({ k: "done", n: a.length }, 1); });
			})
			.catch(function (e) { send({ k: "e", e: String(e) }, 1); });
	},

	// rank badges of several players
	ranks: function () {
		get("/v1/players/rank?account_ids=" + P.get("accs"))
			.then(function (list) {
				var out = {};
				list.forEach(function (r) { out[r.account_id] = r.badge; });
				sendMap("r", out);
				send({ k: "done" }, 1);
			})
			.catch(function (e) { send({ k: "e", e: String(e) }, 1); });
	}
};

send({ k: "hi" }, 0);
(jobs[P.get("job")] || function () { send({ k: "e", e: "unknown job" }, 1); })();
</script>
