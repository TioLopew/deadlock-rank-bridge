<!doctype html><meta charset="utf-8"><title>Deadlock rank mod bridge</title><script>
// Bridge page of the Deadlock rank mod, opened by the game in a hidden HTML panel (the game's HTML panels only open
// http(s) pages, so it is hosted on GitHub Pages):
//   bridge.html?job=<profile|ranks>&p=<title prefix>&q=<request id>&acc=<account>|accs=<accounts>
// Data comes from deadlock-api; results go back to Panorama through document.title, one short message at a time.
var P = new URLSearchParams(location.search);
var PREFIX = P.get("p") || "", REQ = Number(P.get("q"));
var MAX_MESSAGE = 1800;
var queue = [], busy = false, seq = 0;

function send(data, fin) {
	queue.push([data, fin]);
	if (!busy) next();
}

function next() {
	var item = queue.shift();
	if (!item) { busy = false; return; }
	busy = true;
	seq++;
	document.title = PREFIX + JSON.stringify({ q: REQ, s: seq, f: item[1] ? 1 : 0, d: item[0] });
	setTimeout(next, 250);
}

// splits {key: value} into messages of kind k that stay short enough for a page title
function sendMap(k, map) {
	var part = {}, size = 0;
	Object.keys(map).forEach(function (key) {
		var piece = JSON.stringify(map[key]).length + key.length + 4;
		if (size + piece > MAX_MESSAGE && size) {
			send({ k: k, d: part }, 0);
			part = {};
			size = 0;
		}
		part[key] = map[key];
		size += piece;
	});
	if (size) send({ k: k, d: part }, 0);
}

var API = "https://api.deadlock-api.com";
function get(path) {
	return fetch(API + path).then(function (r) { return r.ok ? r.json() : Promise.reject("HTTP " + r.status); });
}

var LATEST = 16;
var METRICS_CACHE_MS = 6 * 3600 * 1000;

// regular 6v6 games: unranked, ranked and placement matches (no bots, private lobbies or hero labs)
function regularMode(mode) {
	return mode === "Unranked" || mode === "Ranked" || /calibration/i.test(String(mode));
}

// community distribution of per-player stats over their latest LATEST matches; cached by the browser for a few hours
function metrics(mode) {
	var key = "dlr_metrics_" + mode + "_" + LATEST;
	try {
		var c = JSON.parse(localStorage.getItem(key) || "null");
		if (c && Date.now() - c.t < METRICS_CACHE_MS) return Promise.resolve(c.d);
	} catch (e) { }
	return get("/v1/analytics/player-stats/metrics?match_mode=" + mode + "&max_matches=" + LATEST).then(function (d) {
		var keep = { accuracy: d.accuracy, crit_shot_rate: d.crit_shot_rate };
		try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: keep })); } catch (e) { }
		return keep;
	}, function () { return null; });
}

// percentile of value inside the thresholds percentile1..percentile99 (linear between them)
function percentile(value, dist) {
	var at = [1, 5, 10, 25, 50, 75, 90, 95, 99];
	if (!dist || typeof value !== "number") return null;
	var prev = null;
	for (var i = 0; i < at.length; i++) {
		var v = dist["percentile" + at[i]];
		if (typeof v !== "number") return null;
		if (value < v) {
			if (prev === null) return at[0];
			return prev[1] === v ? prev[0] : prev[0] + (at[i] - prev[0]) * (value - prev[1]) / (v - prev[1]);
		}
		prev = [at[i], v];
	}
	return at[at.length - 1];
}

// accuracy and headshot (crit) rate over the latest regular matches, with their community percentiles
// (against ranked players when most of those matches were ranked)
function perf(acc) {
	var meta = get("/v1/matches/metadata?account_ids=" + acc + "&game_mode=normal&only_filtered_players=true" +
		"&include_player_final_stats=true&include_info=false&extra_match_columns=match_mode" +
		"&order_by=start_time&order_direction=desc&limit=" + (LATEST + 8) + "&format=json");
	return Promise.all([meta, metrics("Ranked"), metrics("Unranked")]).then(function (r) {
		var latest = r[0].filter(function (m) { return regularMode(m.match_mode); }).slice(0, LATEST);
		if (!latest.length) return null;
		var ranked = latest.filter(function (m) { return m.match_mode === "Ranked"; }).length;
		var dist = ranked * 2 >= latest.length ? r[1] : r[2];
		var hit = 0, missed = 0, heroHit = 0, crit = 0, n = 0;
		latest.forEach(function (match) {
			(match.players || []).forEach(function (p) {
				var s = p.final_stats;
				if (p.account_id != acc || !s) return;
				n++;
				hit += s.shots_hit || 0;
				missed += s.shots_missed || 0;
				heroHit += s.hero_bullets_hit || 0;
				crit += s.hero_bullets_hit_crit || 0;
			});
		});
		var accuracy = hit + missed ? hit / (hit + missed) : null;
		var hs = heroHit + crit ? crit / (heroHit + crit) : null;
		return {
			acc: [accuracy, percentile(accuracy, dist && dist.accuracy)],
			hs: [hs, percentile(hs, dist && dist.crit_shot_rate)],
			n: n, md: dist === r[1] ? 1 : 0
		};
	});
}

var jobs = {
	// one player's profile: accuracy / headshot rate over the latest matches, and total games / wins / last hits.
	// The full match history is exact but deadlock-api can take half a minute for it, so the stored per-hero stats
	// give quick totals first and the match history replaces them once it arrives.
	profile: function () {
		var acc = P.get("acc");
		var full = false;
		var stats = perf(acc).then(function (p) { if (p) send({ k: "p", d: p }, 0); }, function () { });
		var quick = get("/v1/players/hero-stats?account_ids=" + acc + "&game_mode=normal").then(function (list) {
			if (full || !list.length) return;
			var t = [0, 0, 0];
			list.forEach(function (h) {
				t[0] += h.matches_played || 0;
				t[1] += h.wins || 0;
				t[2] += Math.round((h.last_hits_per_min || 0) * (h.time_played || 0) / 60);
			});
			send({ k: "t", d: t, full: 0 }, 0);
		}, function () { });
		var history = get("/v1/players/" + acc + "/match-history").then(function (all) {
			var t = [0, 0, 0];
			all.forEach(function (m) {
				if (m.game_mode != 1 || [1, 4, 8].indexOf(m.match_mode) < 0) return;
				t[0]++;
				t[1] += m.player_team == m.match_result ? 1 : 0;
				t[2] += m.last_hits || 0;
			});
			full = true;
			send({ k: "t", d: t, full: 1 }, 0);
		}, function () { });
		Promise.all([stats, quick, history]).then(function () { send({ k: "done" }, 1); });
	},

	// rank badges of several players
	ranks: function () {
		get("/v1/players/rank?account_ids=" + P.get("accs"))
			.then(function (list) {
				var out = {};
				list.forEach(function (r) { out[r.account_id] = r.badge; });
				sendMap("r", out);
				send({ k: "done" }, 1);
			})
			.catch(function (e) { send({ k: "e", e: String(e) }, 1); });
	}
};

send({ k: "hi" }, 0);
(jobs[P.get("job")] || function () { send({ k: "e", e: "unknown job" }, 1); })();
</script>
