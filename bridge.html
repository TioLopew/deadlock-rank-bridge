<!doctype html><meta charset="utf-8"><title>Deadlock rank mod bridge</title><script src="shared.js?v=da2c788e39"></script><script src="playstyle.js?v=e114d79377"></script><script src="pvdata.js?v=c66c6103a8"></script><script>
// Bridge page of the Deadlock rank mod, opened by the game in a hidden HTML panel (the game's HTML panels only open
// http(s) pages, so it is hosted on GitHub Pages):
//   bridge.html#job=<profile|ranks|allbadges|party>&p=<title prefix>&q=<request id>&acc=<account>|accs=<accounts>|f=..&e=..
// The page stays loaded between jobs: the game only changes the part after "#" and the next job starts at once.
// Data comes from deadlock-api; results go back to Panorama through document.title, one short message at a time.
// Ranked seasons (rank points scale, which season is on) come from shared.js. Badges go out as a code: a job with
// sz=1 (mod builds that know seasons) gets a badge whose player has no ranked match in the current season yet as
// badge + 1000 ("last season's"); with sz=2 also + 10000 * the ranked win streak (current season only). Older builds
// get the plain badge.
var MAX_MESSAGE = 1800;
var SPACING_MS = 250;   // time between two titles, so the game sees every one of them
var queue = [], busy = false, seq = 0, current = null;

function next() {
	var item = queue.shift();
	if (!item) { busy = false; return; }
	busy = true;
	seq++;
	document.title = item.job.prefix + JSON.stringify({ q: item.job.req, s: seq, f: item.fin ? 1 : 0, d: item.data });
	setTimeout(next, SPACING_MS);
}

// one job: its messages carry its own prefix and request id; once the next job starts, it stays silent
function Job(params) {
	this.P = params;
	this.prefix = params.get("p") || "";
	this.req = Number(params.get("q"));
}

Job.prototype.send = function (data, fin) {
	if (current !== this) return;
	queue.push({ job: this, data: data, fin: fin });
	if (!busy) next();
};

// splits {key: value} into messages of kind k that stay short enough for a page title; fin marks the last one
Job.prototype.sendMap = function (k, map, fin) {
	var self = this, parts = [], part = {}, size = 0;
	Object.keys(map).forEach(function (key) {
		var piece = JSON.stringify(map[key]).length + key.length + 4;
		if (size + piece > MAX_MESSAGE && size) {
			parts.push(part);
			part = {};
			size = 0;
		}
		part[key] = map[key];
		size += piece;
	});
	if (size) parts.push(part);
	if (!parts.length && fin) self.send({ k: "done" }, 1);
	parts.forEach(function (d, i) { self.send({ k: k, d: d }, fin && i === parts.length - 1 ? 1 : 0); });
};

// splits a list into messages of kind k: { k, i: index of the first item, d: items, ...extra }; fin marks the last one
Job.prototype.sendList = function (k, list, fin, extra) {
	var self = this, parts = [], part = [], size = 0, start = 0, starts = [0];
	list.forEach(function (x, i) {
		var piece = JSON.stringify(x).length + 1;
		if (size + piece > MAX_MESSAGE - 120 && part.length) {
			parts.push(part);
			starts.push(i);
			part = [];
			size = 0;
		}
		part.push(x);
		size += piece;
	});
	if (part.length || !parts.length) parts.push(part);
	parts.forEach(function (d, j) {
		var msg = { k: k, i: starts[j], d: d };
		for (var key in extra || {}) if (Object.prototype.hasOwnProperty.call(extra, key)) msg[key] = extra[key];
		self.send(msg, fin && j === parts.length - 1 ? 1 : 0);
	});
};

var API = "https://api.deadlock-api.com";

// A 429 answer puts its family of requests on hold for the time deadlock-api asks (kept in the browser storage, so it
// holds across jobs, pages and game restarts); until then the family's requests fail at once instead of piling up.
var COOLDOWN_PREFIX = "dlr_cool_";

function cooldownLeft(family) {
	try { return Math.max(0, Number(JSON.parse(localStorage.getItem(COOLDOWN_PREFIX + family) || "0")) - Date.now()); } catch (e) { return 0; }
}

function get(path, family) {
	var left = family ? cooldownLeft(family) : 0;
	if (left > 0) return Promise.reject("cooldown " + Math.ceil(left / 1000) + "s");
	// straight to deadlock-api, or through the mod's mirror when the straight way is cut (shared.js)
	return DLRPage.apiFetch(path).then(function (r) {
		if (r.status === 429 && family) {
			var s = 0;
			try { s = Number(r.headers.get("retry-after")); } catch (e) { s = 0; }
			if (!(s > 0)) s = 60;
			try { localStorage.setItem(COOLDOWN_PREFIX + family, JSON.stringify(Date.now() + Math.min(s, 3600) * 1000)); } catch (e) { }
		}
		return r.status >= 200 && r.status < 300 ? r.data : Promise.reject("HTTP " + r.status);
	}, function (e) {
		return Promise.reject("network " + (e && e.net || e));
	});
}

var METRICS_CACHE_MS = 6 * 3600 * 1000;

// community distribution of the per-match stats of the last 30 days; cached by the browser for a few hours
function metrics() {
	var key = "dlr_metrics";
	try {
		var c = JSON.parse(localStorage.getItem(key) || "null");
		if (c && Date.now() - c.t < METRICS_CACHE_MS) return Promise.resolve(c.d);
	} catch (e) { }
	return get("/v1/analytics/player-stats/metrics", "analytics").then(function (d) {
		var keep = { accuracy: d.accuracy, crit_shot_rate: d.crit_shot_rate };
		try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: keep })); } catch (e) { }
		return keep;
	}, function () { return null; });
}

// percentile of value inside the thresholds percentile1..percentile99 (linear between them)
function percentile(value, dist) {
	var at = [1, 5, 10, 25, 50, 75, 90, 95, 99];
	if (!dist || typeof value !== "number") return null;
	var prev = null;
	for (var i = 0; i < at.length; i++) {
		var v = dist["percentile" + at[i]];
		if (typeof v !== "number") return null;
		if (value < v) {
			if (prev === null) return at[0];
			return prev[1] === v ? prev[0] : prev[0] + (at[i] - prev[0]) * (value - prev[1]) / (v - prev[1]);
		}
		prev = [at[i], v];
	}
	return at[at.length - 1];
}

// weighted average of a per-hero rate (weights: matches played on the hero)
function average(list, field) {
	var sum = 0, n = 0;
	list.forEach(function (h) {
		if (typeof h[field] !== "number" || !h.matches_played) return;
		sum += h[field] * h.matches_played;
		n += h.matches_played;
	});
	return n ? sum / n : null;
}

function round(x, digits) {
	return typeof x === "number" ? Number(x.toFixed(digits)) : x;
}

// every player loaded once stays in the browser storage (a few hundred bytes each), so it shows at once next time,
// also after a game restart
var STORE_PREFIX = "dlr_player_";
var STORE_KEEP_MS = 60 * 24 * 3600 * 1000;
var PROFILE_MH_FRESH_MS = 15 * 60 * 1000;

function stored(acc) {
	try {
		var e = JSON.parse(localStorage.getItem(STORE_PREFIX + acc) || "null");
		return e && Date.now() - e.at < STORE_KEEP_MS ? e : null;
	} catch (x) {
		return null;
	}
}

function store(acc, e) {
	e.at = Date.now();
	try { localStorage.setItem(STORE_PREFIX + acc, JSON.stringify(e)); } catch (x) { }
}

// rank badges (tier * 10 + subrank, 0 = no rank) are kept the same way: account -> [badge, time looked up, 1 when
// the badge is from an earlier season (no ranked match in the current one), else 0]. Entries without that flag were
// kept before seasons were known: their flag is unknown, so they count as old for a fresh look-up.
var BADGE_PREFIX = "dlr_badge_";
var OLD_SEASON = 1000;

var STREAK = 10000;

// the ranked win streak after the latest ranked match of a /rank answer: the streak it started with, + 1 for a win
function winStreak(r) {
	var m = r && r.last_match;
	if (!m || typeof m.player_rank_initial_win_streak !== "number") return 0;
	return (m.player_rank_desired_progress_change || 0) > 0 ? Math.min(99, m.player_rank_initial_win_streak + 1) : 0;
}

// whether a /rank answer's badge is from before the current season
function oldSeason(r) {
	var t = r && r.last_match && r.last_match.start_time;
	return !!(r && r.badge > 0 && t && t < DLRPage.seasonAt(Date.now() / 1000).start);
}

// the badge as a job gets it: with sz >= 1 an earlier season's badge + OLD_SEASON, with sz >= 2 also the streak
function badgeFor(job, badge, old, streak) {
	var sz = Number(job.P.get("sz")) || 0;
	if (!(badge > 0) || !sz) return badge;
	if (old) return badge + OLD_SEASON;
	return badge + (sz >= 2 && streak > 0 ? streak * STREAK : 0);
}

function storedBadge(acc) {
	try {
		var e = JSON.parse(localStorage.getItem(BADGE_PREFIX + acc) || "null");
		return e && Date.now() - e[1] < STORE_KEEP_MS ? e : null;
	} catch (x) {
		return null;
	}
}

// [badge, time, old season, win streak]
function storeBadge(acc, badge, old, streak) {
	try { localStorage.setItem(BADGE_PREFIX + acc, JSON.stringify([badge, Date.now(), old ? 1 : 0, streak || 0])); } catch (x) { }
}

// every key of the browser storage that starts with prefix, without the prefix
function storedKeys(prefix) {
	var out = [];
	try {
		for (var i = 0; i < localStorage.length; i++) {
			var key = localStorage.key(i);
			if (key && key.indexOf(prefix) === 0) out.push(key.substring(prefix.length));
		}
	} catch (x) { }
	return out;
}

// A player's ranked history for the rank history chart (rank-history.html reads it from this same storage):
// { at, p: [[start time, badge after the match, rank points the match gave], ...] } oldest first. It is the biggest
// thing kept (about 20 bytes a match), so only the most recently seen HISTORY_MAX players keep one.
var HISTORY_PREFIX = "dlr_rh_";
var HISTORY_MAX = 40;

function storedHistory(acc) {
	try {
		var e = JSON.parse(localStorage.getItem(HISTORY_PREFIX + acc) || "null");
		return e && Date.now() - e.at < STORE_KEEP_MS ? e : null;
	} catch (x) {
		return null;
	}
}

function storeHistory(acc, points) {
	try {
		var others = storedKeys(HISTORY_PREFIX).filter(function (a) { return a !== String(acc); });
		if (others.length >= HISTORY_MAX) {
			others.map(function (a) { var e = storedHistory(a); return [a, e ? e.at : 0]; })
				.sort(function (a, b) { return a[1] - b[1]; })
				.slice(0, others.length - HISTORY_MAX + 1)
				.forEach(function (it) { localStorage.removeItem(HISTORY_PREFIX + it[0]); });
		}
		localStorage.setItem(HISTORY_PREFIX + acc, JSON.stringify({ at: Date.now(), p: points }));
	} catch (x) { }
}

// ranked matches with a badge, one per match, oldest first: [start time, badge, rank points it gave]
// (from the kept history, DLRPV's compact rows)
function rankPoints(matches) {
	var seen = {}, out = [], M = DLRPV.M;
	matches.forEach(function (m) {
		if (m[M.mode] !== 4 || !(m[M.badge] > 0) || !m[M.t] || seen[m[M.id]]) return;
		seen[m[M.id]] = 1;
		out.push([m[M.t], m[M.badge], typeof m[M.delta] === "number" ? m[M.delta] : 0]);
	});
	return out.sort(function (a, b) { return a[0] - b[0]; });
}

// [best badge, season number] of the newest season in points ([[time, badge, gain], ...], oldest first), or null
function peak(points) {
	if (!points.length) return null;
	var season = DLRPage.seasonAt(points[points.length - 1][0]), best = 0;
	points.forEach(function (p) { if (DLRPage.seasonAt(p[0]) === season && p[1] > best) best = p[1]; });
	return best > 0 ? [best, season.n] : null;
}

// ---------- leaderboard ----------
// Valve's leaderboards are per region (deadlock-api: Europe, Asia, NAmerica, SAmerica, Oceania) and per season; an
// entry has a name and the accounts it may be (possible_account_ids). The player's region is the one they played most
// in lately (/region, kept a week). The place is looked for in the current season's board, else in the one before.
// The answer per player is kept an hour: [place, region, season number], or null.
var LB_PREFIX = "dlr_lb_", REGION_PREFIX = "dlr_region_";
var LB_KEEP_MS = 3600 * 1000, REGION_KEEP_MS = 7 * 24 * 3600 * 1000;
var boards = {};   // region|leaderboard id -> { at, entries } while the page stays loaded

function boardRegion(server) {
	var s = String(server || "");
	if (/^(eu|europe|south_africa)/.test(s)) return "Europe";
	if (/^us/.test(s)) return "NAmerica";
	if (/^(chile|peru|argentina|south_america|brazil)/.test(s)) return "SAmerica";
	if (/^(australia|oceania)/.test(s)) return "Oceania";
	if (/^(singapore|japan|hong_kong|mp_hong_kong|seoul|asia|india|china)/.test(s)) return "Asia";
	return "";
}

function readKept(key, ttl) {
	try {
		var e = JSON.parse(localStorage.getItem(key) || "null");
		return e && Date.now() - e.at < ttl ? e : null;
	} catch (x) {
		return null;
	}
}

function keepValue(key, value) {
	try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), v: value })); } catch (x) { }
}

function board(region, id) {
	var key = region + "|" + id, b = boards[key];
	if (b && Date.now() - b.at < LB_KEEP_MS) return Promise.resolve(b.entries);
	return get("/v1/leaderboard/" + region + (id ? "?leaderboard_id=" + id : ""), "lb").then(function (d) {
		var entries = (d && d.entries) || [];
		boards[key] = { at: Date.now(), entries: entries };
		return entries;
	});
}

function placeIn(entries, acc) {
	var n = Number(acc);
	for (var i = 0; i < entries.length; i++) if ((entries[i].possible_account_ids || []).indexOf(n) >= 0) return entries[i].rank;
	return 0;
}

function leaderboardPlace(acc) {
	var kept = readKept(LB_PREFIX + acc, LB_KEEP_MS);
	if (kept) return Promise.resolve(kept.v);
	var region = readKept(REGION_PREFIX + acc, REGION_KEEP_MS);
	var regionLoad = region ? Promise.resolve(region.v) : get("/v1/players/" + acc + "/region", "region").then(function (r) {
		var v = boardRegion(r && r.region);
		keepValue(REGION_PREFIX + acc, v);
		return v;
	});
	return regionLoad.then(function (reg) {
		if (!reg) return null;
		var list = DLRPage.seasons(), cur = DLRPage.seasonAt(Date.now() / 1000), i = list.indexOf(cur);
		var prev = i > 0 ? list[i - 1] : null;
		return board(reg, cur.lb || 0).then(function (entries) {
			var place = placeIn(entries, acc);
			if (place) return [place, reg, cur.n];
			if (!prev || !prev.lb) return null;
			return board(reg, prev.lb).then(function (old) {
				var pl = placeIn(old, acc);
				return pl ? [pl, reg, prev.n] : null;
			});
		});
	}).then(function (v) {
		keepValue(LB_PREFIX + acc, v);
		return v;
	});
}

// ---------- settings ----------
var CFG_KEY = "dlr_cfg";

function storedCfg() {
	try {
		var e = JSON.parse(localStorage.getItem(CFG_KEY) || "null");
		return e && e.c ? e.c : {};
	} catch (x) {
		return {};
	}
}

// now and then drop players, badges and histories nobody looked at for a long time
function prune() {
	try {
		storedKeys(STORE_PREFIX).forEach(function (acc) { if (!stored(acc)) localStorage.removeItem(STORE_PREFIX + acc); });
		storedKeys(BADGE_PREFIX).forEach(function (acc) { if (!storedBadge(acc)) localStorage.removeItem(BADGE_PREFIX + acc); });
		storedKeys(HISTORY_PREFIX).forEach(function (acc) { if (!storedHistory(acc)) localStorage.removeItem(HISTORY_PREFIX + acc); });
		storedKeys(PARTY_PREFIX).forEach(function (key) {
			var e = null;
			try { e = JSON.parse(localStorage.getItem(PARTY_PREFIX + key) || "null"); } catch (x) { e = null; }
			if (!e || Date.now() - e.at > PARTY_KEEP_MS) localStorage.removeItem(PARTY_PREFIX + key);
		});
	} catch (x) { }
}

// Steam friends in one team of a match, grouped: players who are Steam friends (directly or through each other) and
// on the same side most likely queued together (deadlock-api's own "same party" rule). Groups of two or more, as
// lists of accounts.
var PARTY_PREFIX = "dlr_party_";
var PARTY_KEEP_MS = 6 * 3600 * 1000;

function friendGroups(profiles, sides) {
	var parent = {};
	function find(a) {
		while (parent[a] !== a) a = parent[a] = parent[parent[a]];
		return a;
	}
	Object.keys(sides).forEach(function (a) { parent[a] = a; });
	profiles.forEach(function (p) {
		var a = String(p.account_id);
		if (!sides[a]) return;
		(p.friends || []).forEach(function (f) {
			var b = String(f.account_id);
			if (b === a || !sides[b] || sides[b] !== sides[a]) return;
			var ra = find(a), rb = find(b);
			if (ra !== rb) parent[ra] = rb;
		});
	});
	var groups = {};
	Object.keys(sides).forEach(function (a) {
		var r = find(a);
		(groups[r] = groups[r] || []).push(a);
	});
	return Object.keys(groups).map(function (r) { return groups[r].sort(); })
		.filter(function (g) { return g.length >= 2; })
		.sort(function (x, y) { return x[0] < y[0] ? -1 : 1; });
}

// the job's list of accounts (param "accs", or another one)
function accounts(job, param) {
	return String(job.P.get(param || "accs") || "").split(",").filter(function (a) { return /^\d+$/.test(a); });
}

// looks the badges of accs up on deadlock-api, keeps them and sends those that differ from known; ends the job
function freshRanks(job, accs, known) {
	get("/v1/players/rank?account_ids=" + accs.join(","), "rank")
		.then(function (list) {
			var fresh = {};
			list.forEach(function (r) {
				var badge = typeof r.badge === "number" ? r.badge : 0, old = oldSeason(r), streak = winStreak(r);
				storeBadge(r.account_id, badge, old, streak);
				badge = badgeFor(job, badge, old, streak);
				if (known[r.account_id] !== badge) fresh[r.account_id] = badge;
			});
			job.sendMap("r", fresh, 1);
		})
		.catch(function (e) { job.send({ k: "e", e: String(e) }, 1); });
}

var jobs = {
	// one player's profile: accuracy / headshot rate, total games / wins / last hits, rank progress and the ranked
	// history (kept for the rank history chart; the game is told how many matches it has).
	// What this browser already knows goes out first. deadlock-api's per-hero stats answer quickly; the full match
	// history is exact but can take half a minute, so its totals replace the quick ones once it arrives.
	profile: function (job) {
		var acc = job.P.get("acc");
		var saved = stored(acc) || { t: null, full: 0, p: null, g: null };
		var sent = {};
		// a message that repeats what already went out is skipped
		function give(msg) {
			var text = JSON.stringify(msg);
			if (sent[msg.k] === text) return;
			sent[msg.k] = text;
			job.send(msg, 0);
		}
		var oldHistory = storedHistory(acc);
		if (saved.t) give({ k: "t", d: saved.t, full: saved.full });
		if (saved.p) give({ k: "p", d: saved.p });
		if (saved.g) give({ k: "g", d: saved.g });
		if (saved.pk) give({ k: "pk", d: saved.pk });
		if (saved.hs) give({ k: "hs", d: saved.hs });
		if (saved.f) give({ k: "f", d: saved.f });
		if (oldHistory) give({ k: "h", d: oldHistory.p.length });
		if (!saved.t && !saved.p && !saved.g) job.send({ k: "hi" }, 0);
		// rank progress: badge and rank points after the latest ranked match
		var progress = get("/v1/players/" + acc + "/rank").then(function (r) {
			if (!r || typeof r.badge !== "number") return;
			var fp = r.last_match && typeof r.last_match.player_rank_final_flat_progress === "number" ? r.last_match.player_rank_final_flat_progress : null;
			// [badge, rank points, points into the subrank, points the subrank takes (both in the season of the
			// latest ranked match; null for Eternus), 1 if that match is from an earlier season, its season number]
			var t = r.last_match && r.last_match.start_time, old = oldSeason(r), pr = DLRPage.progress(r.badge, fp, t);
			var streak = old ? 0 : winStreak(r);
			// [.., win streak (current season)]
			saved.g = [r.badge, fp, pr ? pr.pts : null, pr ? pr.need : null, old ? 1 : 0, t ? DLRPage.seasonAt(t).n : 0, streak];
			storeBadge(acc, r.badge, old, streak);
			store(acc, saved);
			give({ k: "g", d: saved.g });
		}, function () { });
		if (Math.random() < 0.05) prune();
		// deadlock-api's season list, at most once a day (the built-in one covers the seasons known when this was made)
		DLRPage.loadSeasons();
		var full = false;
		var heroes = get("/v1/players/hero-stats?account_ids=" + acc + "&game_mode=normal").then(function (list) {
			// games / wins on each hero (the hover card shows the ones of the hero he has in a match)
			var hs = {};
			list.forEach(function (h) { if (h.hero_id && h.matches_played > 0) hs[h.hero_id] = [h.matches_played, h.wins || 0]; });
			if (list.length) {
				saved.hs = hs;
				store(acc, saved);
				give({ k: "hs", d: hs });
			}
			// stored totals from the full history beat fresh quick ones
			if (!full && !saved.full && list.length) {
				var t = [0, 0, 0];
				list.forEach(function (h) {
					t[0] += h.matches_played || 0;
					t[1] += h.wins || 0;
					t[2] += Math.round((h.last_hits_per_min || 0) * (h.time_played || 0) / 60);
				});
				saved.t = t;
				store(acc, saved);
				give({ k: "t", d: t, full: 0 });
			}
			return list;
		}, function () { return []; });
		var stats = Promise.all([heroes, metrics()]).then(function (r) {
			var accuracy = average(r[0], "accuracy"), hs = average(r[0], "crit_shot_rate"), dist = r[1];
			if (accuracy === null && hs === null) return;
			saved.p = {
				acc: [round(accuracy, 4), round(percentile(accuracy, dist && dist.accuracy), 1)],
				hs: [round(hs, 4), round(percentile(hs, dist && dist.crit_shot_rate), 1)]
			};
			store(acc, saved);
			give({ k: "p", d: saved.p });
		});
		// the history the mod's profile page keeps on disk too (one taken in the last PROFILE_MH_FRESH_MS counts as
		// fresh, so a player met again soon costs no look-up, and his profile opens at once)
		var history = DLRPV.history(acc, true, PROFILE_MH_FRESH_MS).then(function (h) {
			var all = h.d, M = DLRPV.M, t = [0, 0, 0];
			all.forEach(function (m) {
				if (!DLRPV.counted(m)) return;
				t[0]++;
				t[1] += m[M.win] ? 1 : 0;
				t[2] += m[M.lh] || 0;
			});
			// the start of the first match deadlock-api knows of him
			var first = 0;
			all.forEach(function (m) { if (m[M.t] > 0 && (!first || m[M.t] < first)) first = m[M.t]; });
			if (first) {
				saved.f = first;
				give({ k: "f", d: first });
			}
			full = true;
			saved.t = t;
			saved.full = 1;
			store(acc, saved);
			give({ k: "t", d: t, full: 1 });
			var points = rankPoints(all);
			storeHistory(acc, points);
			give({ k: "h", d: points.length });
			// the best badge of the newest season the player has ranked matches in: [badge, season number]
			var pk = peak(points);
			if (pk) {
				saved.pk = pk;
				store(acc, saved);
				give({ k: "pk", d: pk });
			}
		}, function () { });
		// the leaderboard place, for the profile page only (lb=1): one leaderboard is ~0.5 MB
		var board = job.P.get("lb") === "1" ? leaderboardPlace(acc).then(function (d) { give({ k: "lb", d: d }); }, function () { }) : null;
		Promise.all([stats, history, progress, board]).then(function () { job.send({ k: "done" }, 1); });
	},

	// The mod's profile page as the game draws it (dlr_pv.js): one part per job (pvdata.js has what each carries).
	//   part=mh&hero=&mode=&res=&season=&from=&n=&wait=   summary of the whole history, then the filtered rows from..from+n
	//   part=b&ids=<match ids>                         final builds of those matches
//   part=items&lang=&ids=<item ids>                 the shop's cards of those items
	//   part=heroes&season=&mode= | part=mates&side=&season= | part=style | part=stats&hero= | part=rh&season=
	pv: function (job) {
		var P = job.P, acc = P.get("acc") || "", part = P.get("part");
		function fail(e) { job.send({ k: "e", e: String(e) }, 1); }
		if (!/^\d+$/.test(acc)) return fail("account");
		DLRPage.loadSeasons();
		if (part === "mh") {
			var f = { hero: Number(P.get("hero")) || 0, mode: P.get("mode") || "", res: P.get("res") || "", season: Number(P.get("season")) || 0,
				day: /^\d{8}$/.test(P.get("day") || "") ? P.get("day") : "" };
			var from = Math.max(0, Number(P.get("from")) || 0), n = Math.max(1, Math.min(60, Number(P.get("n")) || 30));
			// the game's own matches the mod sends (nat): kept, and in the history wherever deadlock-api lacks them; with
			// deadlock-api out of reach, the history is those alone
			var nat = null;
			try { nat = JSON.parse(P.get("nat") || "null"); } catch (x) { nat = null; }
			if (nat) DLRPV.keepNatives(acc, nat);
			DLRPV.history(acc, P.get("wait") === "1").catch(function (e) {
				if (DLRPV.natives(acc).length) return { d: [], stale: false, failed: true };
				throw e;
			}).then(function (h) {
				h = { d: DLRPV.withNatives(acc, h.d), stale: h.stale };
				var sel = DLRPV.matches(h.d, f), st = DLRPV.streaks(h.d), saved = stored(acc);
				// (the calendar's days: the matches of the same filters on any day)
				var dc = DLRPV.dayCounts(f.day ? DLRPV.matches(h.d, { hero: f.hero, mode: f.mode, res: f.res, season: f.season }) : sel);
				job.send({ k: "sum", d: DLRPV.summary(h.d, saved && saved.g, f), stale: h.stale ? 1 : 0, total: sel.length, dc: dc }, 0);
				job.sendList("rows", sel.slice(from, from + n).map(function (m) { return DLRPV.row(m, st); }), 1, { from: from, total: sel.length });
			}, fail);
		} else if (part === "b") {
			var ids = String(P.get("ids") || "").split(",").filter(function (x) { return /^\d+$/.test(x); }).slice(0, 20);
			DLRPV.builds(acc, ids).then(function (out) { job.sendMap("b", out, 1); }, fail);
		} else if (part === "items") {
			// the shop's cards of some items (part=items&lang=&ids=)
			var iids = String(P.get("ids") || "").split(",").filter(function (x) { return /^\d+$/.test(x); }).slice(0, 60);
			DLRPV.itemCards(P.get("lang") || "", iids).then(function (out) { job.sendMap("it", out, 1); }, fail);
		} else if (part === "heroes") {
			DLRPV.heroStats(acc, P.get("season") || "all", P.get("mode") || "").then(function (rows) {
				job.sendList("heroes", rows.map(function (x) { return x.slice(0, 10); }), 1);
			}, fail);
		} else if (part === "mates") {
			DLRPV.mates(acc, P.get("side") === "vs" ? "vs" : "with", P.get("season") || "all").then(function (r) {
				job.send({ k: "msum", s: r.s || null, b: r.b || null }, 0);
				job.sendList("mates", r.r, 1);
			}, fail);
		} else if (part === "rh") {
			// (the chart points' matches go as a list of their own: they can be many)
			DLRPV.rankHistory(acc, Number(P.get("season")) || 0).then(function (r) {
				var hm = r.hm || [];
				delete r.hm;
				job.send({ k: "rh", d: r }, 0);
				job.sendList("rhm", hm, 1);
			}, fail);
		} else if (part === "style") {
			DLRStyle.load(acc).then(function (r) { job.send({ k: "style", d: r }, 1); }, fail);
		} else if (part === "stats") {
			DLRPV.stats(acc, Number(P.get("hero")) || 0).then(function (r) { job.send({ k: "stats", d: r }, 1); }, fail);
		} else {
			fail("part");
		}
	},

	// games / wins of several players at once (one request), for the smurf mark in a match: account -> [games, wins]
	meta: function (job) {
		var accs = accounts(job);
		if (!accs.length) return job.send({ k: "done" }, 1);
		job.send({ k: "hi" }, 0);
		get("/v1/players/hero-stats?account_ids=" + accs.join(",") + "&game_mode=normal", "meta")
			.then(function (list) {
				var out = {};
				accs.forEach(function (a) { out[a] = [0, 0]; });
				(list || []).forEach(function (h) {
					var e = out[h.account_id];
					if (!e) return;
					e[0] += h.matches_played || 0;
					e[1] += h.wins || 0;
				});
				job.sendMap("m", out, 1);
			})
			.catch(function (e) { job.send({ k: "e", e: String(e) }, 1); });
	},

	// the mod's settings (switches), kept in this browser's storage: cfg sends them, setcfg (c: JSON) keeps new ones
	cfg: function (job) {
		job.send({ k: "cfg", d: storedCfg() }, 1);
	},
	setcfg: function (job) {
		var c = {};
		try { c = JSON.parse(job.P.get("c") || "{}") || {}; } catch (x) { c = {}; }
		var kept = {};
		// (switches, and options: a short word)
		Object.keys(c).forEach(function (k) {
			if (/^[a-z]{1,16}$/.test(k) && (typeof c[k] === "boolean" || (typeof c[k] === "string" && /^[a-z0-9]{1,12}$/.test(c[k])))) kept[k] = c[k];
		});
		try { localStorage.setItem(CFG_KEY, JSON.stringify({ at: Date.now(), c: kept })); } catch (x) { }
		job.send({ k: "cfg", d: kept }, 1);
	},

	// Steam friends grouped per team of a match (f / e: the two teams' accounts), for the party markers. The same
	// line-up is answered from storage for a few hours.
	party: function (job) {
		var sides = {}, f = accounts(job, "f"), e = accounts(job, "e");
		f.forEach(function (a) { sides[a] = "f"; });
		e.forEach(function (a) { if (!sides[a]) sides[a] = "e"; });
		var all = Object.keys(sides).sort();
		if (!all.length) return job.send({ k: "party", d: [] }, 1);
		var key = PARTY_PREFIX + f.slice().sort().join(".") + "_" + e.slice().sort().join(".");
		try {
			var c = JSON.parse(localStorage.getItem(key) || "null");
			if (c && Date.now() - c.at < PARTY_KEEP_MS) return job.send({ k: "party", d: c.g }, 1);
		} catch (x) { }
		job.send({ k: "hi" }, 0);
		get("/v1/players/steam?account_ids=" + all.join(","))
			.then(function (profiles) {
				var groups = friendGroups(profiles || [], sides);
				try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), g: groups })); } catch (x) { }
				job.send({ k: "party", d: groups }, 1);
			})
			.catch(function (err) { job.send({ k: "e", e: String(err) }, 1); });
	},

	// rank badges of several players: those this browser keeps go out first, then the ones that changed
	ranks: function (job) {
		var accs = accounts(job), known = {};
		accs.forEach(function (a) {
			var e = storedBadge(a);
			if (e) known[a] = badgeFor(job, e[0], e[2] !== 0, e[3] || 0);
		});
		if (Math.random() < 0.05) prune();
		if (Object.keys(known).length) job.sendMap("r", known, 0);
		else job.send({ k: "hi" }, 0);
		freshRanks(job, accs, known);
	},

	// every badge this browser keeps, most recently seen first, as "account:badge:age in minutes" lists: a screen
	// of the game that just came up knows all of them at once. With since (a time), only the badges looked up from
	// then on: a screen catching up with what other screens looked up meanwhile. Accounts in accs are looked up fresh.
	allbadges: function (job) {
		var now = Date.now(), items = [], accs = accounts(job), since = Number(job.P.get("since")) || 0;
		// mod builds with settings (sz=2) get them along with the badges
		if (Number(job.P.get("sz")) >= 2) job.send({ k: "cfg", d: storedCfg() }, 0);
		storedKeys(BADGE_PREFIX).forEach(function (acc) {
			var e = storedBadge(acc);
			// without a season flag (kept before seasons were known) it goes out as hours old: looked up again soon
			if (e && e[1] >= since) items.push([acc, badgeFor(job, e[0], e[2] !== 0, e[3] || 0), e.length > 2 ? now - e[1] : Math.max(now - e[1], 4 * 3600 * 1000)]);
		});
		items.sort(function (a, b) { return a[2] - b[2]; });
		var parts = [], cur = "", known = {};
		items.forEach(function (it) {
			known[it[0]] = it[1];
			var text = it[0] + ":" + it[1] + ":" + Math.floor(it[2] / 60000);
			if (cur && cur.length + text.length + 1 > MAX_MESSAGE) {
				parts.push(cur);
				cur = "";
			}
			cur += (cur ? "," : "") + text;
		});
		if (cur) parts.push(cur);
		var last = accs.length ? -1 : parts.length - 1;
		parts.forEach(function (d, i) { job.send({ k: "b", d: d }, i === last ? 1 : 0); });
		if (accs.length) freshRanks(job, accs, known);
		else if (!parts.length) job.send({ k: "done" }, 1);
	}
};

// a job comes in the part after "#" (also on the first load); older pages put it in the query string
function start() {
	var job = new Job(new URLSearchParams(location.hash.slice(1) || location.search.slice(1)));
	if (current && current.req === job.req && current.prefix === job.prefix) return;
	current = job;
	// messages still waiting from the previous job are of no use any more
	queue = queue.filter(function (item) { return item.job === job; });
	(jobs[job.P.get("job")] || function () { job.send({ k: "e", e: "unknown job" }, 1); })(job);
}

window.addEventListener("hashchange", start);
start();
</script>
